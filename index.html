<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阳阳中文 第八课 我的宠物 · 识字游戏</title><style>
:root{font-family:system-ui,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;color:#19324a;background:#f3f8fb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#2675a6,#35a48d);color:white;padding:24px 16px;text-align:center}h1{margin:0;font-size:clamp(26px,4vw,42px)}header p{margin:8px 0 0}.wrap{max-width:1100px;margin:auto;padding:18px}.toolbar,.tabs,.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}.tabs button{flex:1;min-width:130px}.panel{background:white;border-radius:18px;padding:20px;box-shadow:0 4px 20px #163e5814;margin:14px 0}button,select{font:inherit;cursor:pointer;border-radius:12px;border:1px solid #c8d9e4;background:#fff;color:#174461;padding:11px 15px}button:hover{background:#eaf6ff}button.active,.primary{background:#176b9b;color:white;border-color:#176b9b}button:disabled{opacity:.5;cursor:default}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.tile{min-height:110px;font-size:clamp(23px,3.5vw,40px);font-weight:700;overflow-wrap:anywhere}.tile.back{background:#2a709c;color:white}.tile.matched{background:#d8f4e7;border-color:#3caa79}.muted{color:#58758a}.center{text-align:center}.big{font-size:clamp(44px,8vw,96px);font-weight:700;margin:18px 0}.hint{font-size:clamp(19px,2.5vw,29px);color:#506b7b}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.options button{font-size:clamp(20px,2.7vw,32px);min-height:90px}.good{background:#d6f4df!important;border-color:#35a46d!important;color:#165632!important}.bad{background:#ffe0df!important;border-color:#d65b56!important;color:#892c29!important}.wheel{width:min(70vw,360px);height:min(70vw,360px);border:12px solid #e5b65c;border-radius:50%;background:conic-gradient(#e7f4ff 0 45deg,#fbe7da 45deg 90deg,#d7f5e6 90deg 135deg,#fff2b9 135deg 180deg,#e7f4ff 180deg 225deg,#fbe7da 225deg 270deg,#d7f5e6 270deg 315deg,#fff2b9 315deg 360deg);margin:15px auto;display:grid;place-items:center;box-shadow:0 8px 24px #0002}.wheel span{font-size:clamp(28px,5vw,48px);font-weight:bold;background:white;padding:16px;border-radius:20px}.pairgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.paircol{display:grid;gap:9px}.paircol button{min-height:65px;font-size:clamp(19px,2.5vw,27px)}.paircol .english{font-size:clamp(15px,2vw,21px)}.status{min-height:30px;font-size:19px;font-weight:600}footer{text-align:center;color:#6b8390;padding:20px}.hidden{display:none}@media(max-width:600px){.wrap{padding:10px}.panel{padding:13px}.cards{gap:6px}.tile{min-height:77px;font-size:22px;padding:5px}.options{gap:7px}.options button{min-height:75px;padding:7px}.paircol button{padding:7px;min-height:65px}}@media print{header,.tabs,.toolbar,.controls,footer{display:none}}
@media(max-width:600px){.toolbar label{font-size:15px}.tabs button{min-width:42%;font-size:16px}.big{font-size:48px}.panel{min-height:230px}}
</style></head><body><header><h1>🐶 我的宠物 🐱</h1><p>阳阳中文 · 第八课 · 17个生词识字游戏</p></header><main class="wrap"><div class="toolbar"><label>学习方式 <select id="mode"><option value="class">🏫 课堂投影</option><option value="home">🏠 家庭自学</option></select></label><label><input type="checkbox" id="pinyin"> 显示拼音</label><label><input type="checkbox" id="english"> 显示英文</label><label>练习范围 <select id="range"><option value="all">全部17词</option><option value="a">第1组（1–9）</option><option value="b">第2组（10–17）</option></select></label></div><nav class="tabs"><button class="active" data-game="quiz">⚡ 识字抢答</button><button data-game="memory">🃏 翻牌认字</button><button data-game="match">🔗 中英配对</button><button data-game="wheel">🎡 幸运转盘</button></nav><section class="panel"><div id="game"><p style="text-align:center">正在载入游戏……如果一直显示此文字，请用 Safari 或 Chrome 打开，而不是 iPhone 文件预览。</p></div></section><footer>提示：iPhone 的文件预览可能禁止运行游戏。若按钮无反应，请在 Safari 中通过网站链接打开。电脑版可直接离线运行。本游戏为独立教学练习工具。所有内容均保存在此HTML文件中，可离线使用。家庭练习成绩仅在当前页面显示，不会上传。</footer></main><script>
const vocab=[['送给','sòng gěi','to give as a present'],['只','zhī','measure word for animals'],['狗','gǒu','dog'],['宠物','chǒng wù','pet'],['带','dài','to bring'],['它们','tā men','they / them (animals)'],['散步','sàn bù','to take a walk'],['过','guo','past experience particle'],['去年','qù nián','last year'],['猫','māo','cat'],['上个月','shàng ge yuè','last month'],['养','yǎng','to raise'],['不见了','bú jiàn le','disappeared'],['非常','fēi cháng','very / extremely'],['可爱','kě ài','cute / lovable'],['兔子','tù zi','rabbit'],['喂','wèi','to feed']].map((x,i)=>({id:i,cn:x[0],py:x[1],en:x[2]}));
let game='quiz',qIndex=0,score=0,answered=false,queue=[],flipped=[],found=new Set(),moves=0,selected=null,matched=new Set(),wheelIndex=-1;
const $=id=>document.getElementById(id),rand=a=>[...a].sort(()=>Math.random()-.5),list=()=>vocab.filter(v=>$('range').value==='all'||($('range').value==='a'?v.id<9:v.id>=9));const h=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hints(v){return ($('pinyin').checked?`<div class="hint">${h(v.py)}</div>`:'')+($('english').checked?`<div class="hint">${h(v.en)}</div>`:'')}
function reset(){qIndex=0;score=0;answered=false;queue=rand(list());flipped=[];found=new Set();moves=0;selected=null;matched=new Set();wheelIndex=-1;render()}
function render(){let e=$('game'),a=list();if(game==='quiz'){if(qIndex>=queue.length){e.innerHTML=`<div class="center"><h2>🎉 完成练习！</h2><div class="big">${score} / ${queue.length}</div><button class="primary" onclick="reset()">再练一次</button></div>`;return}let v=queue[qIndex],choices=rand([v,...rand(vocab.filter(x=>x.id!==v.id)).slice(0,3)]);window.quizChoices=choices;e.innerHTML=`<div class="center"><p class="muted">第 ${qIndex+1} / ${queue.length} 题 · 答对 ${score} 题</p><div class="big">${h(v.cn)}</div>${hints(v)}<p>选择正确的英文意思</p></div><div class="options">${choices.map(x=>`<button data-choice="${x.id}">${h(x.en)}</button>`).join('')}</div><p class="status center" id="status"></p><div class="controls" style="justify-content:center"><button id="next" class="primary" disabled>下一题 →</button></div>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;let ok=Number(b.dataset.choice)===v.id;if(ok)score++;document.querySelectorAll('[data-choice]').forEach(z=>{z.disabled=true;if(Number(z.dataset.choice)===v.id)z.classList.add('good');else if(z===b)z.classList.add('bad')});$('status').textContent=ok?'✓ 答对了！':'再记住这个词：'+v.cn+' = '+v.en;$('next').disabled=false});$('next').onclick=()=>{qIndex++;answered=false;render()};}
else if(game==='memory'){if(!window.memoryDeck||window.deckRange!==$('range').value){let chosen=rand(a).slice(0,Math.min(8,a.length));window.memoryDeck=rand([...chosen,...chosen].map((v,i)=>({...v,key:i})));window.deckRange=$('range').value}let d=window.memoryDeck;e.innerHTML=`<div class="center"><h2>翻牌认字</h2><p class="muted">找出相同的词语 · 已配对 ${found.size/2}/${d.length/2} 对 · 尝试 ${moves} 次</p></div><div class="cards">${d.map((v,i)=>`<button class="tile ${found.has(i)?'matched':flipped.includes(i)?'':'back'}" data-card="${i}">${found.has(i)||flipped.includes(i)?h(v.cn)+(flipped.includes(i)?hints(v):''):'❓'}</button>`).join('')}</div><p class="status center">${found.size===d.length?'🎉 全部配对成功！':''}</p><div class="controls"><button onclick="window.memoryDeck=null;reset()">重新洗牌</button>${flipped.length===2?'<button class="primary" id="turnback">继续翻牌 →</button>':''}</div>`;document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.card);if(flipped.length>=2||found.has(i)||flipped.includes(i))return;flipped.push(i);if(flipped.length===2){moves++;if(d[flipped[0]].id===d[flipped[1]].id){found.add(flipped[0]);found.add(flipped[1]);flipped=[]}}render()});if($('turnback'))$('turnback').onclick=()=>{flipped=[];render()};}
else if(game==='match'){if(!window.matchRows||window.matchRange!==$('range').value){window.matchRows=rand(a).slice(0,Math.min(8,a.length));window.matchOrder=rand(window.matchRows);window.matchRange=$('range').value}let left=window.matchRows,right=window.matchOrder;e.innerHTML=`<div class="center"><h2>中英文配对</h2><p class="muted">先点击左侧中文，再点击右侧英文 · 完成 ${matched.size}/${left.length} 对</p></div><div class="pairgrid"><div class="paircol">${left.map(v=>`<button data-left="${v.id}" class="${matched.has(v.id)?'good':selected===v.id?'active':''}" ${matched.has(v.id)?'disabled':''}>${h(v.cn)}${$('pinyin').checked?`<div style="font-size:14px">${h(v.py)}</div>`:''}</button>`).join('')}</div><div class="paircol">${right.map(v=>`<button class="english ${matched.has(v.id)?'good':''}" data-right="${v.id}" ${matched.has(v.id)?'disabled':''}>${h(v.en)}</button>`).join('')}</div></div><p class="status center" id="status">${matched.size===left.length?'🎉 全部配对成功！':''}</p><div class="controls"><button onclick="window.matchRows=null;reset()">换一组词语</button></div>`;document.querySelectorAll('[data-left]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.left);render()});document.querySelectorAll('[data-right]').forEach(b=>b.onclick=()=>{if(selected===null)return;let ok=selected===Number(b.dataset.right);if(ok){matched.add(selected);selected=null;render()}else{$('status').textContent='再试一次！'}});}
else{let v=wheelIndex>=0?vocab[wheelIndex]:null;e.innerHTML=`<div class="center"><h2>幸运识字转盘</h2><p class="muted">随机抽一个词：读出来、说英文意思或用它造句</p><div class="wheel"><span>${v?h(v.cn):'点击抽词'}</span></div>${v?hints(v):''}<div class="controls" style="justify-content:center"><button class="primary" id="spin">🎡 ${v?'再抽一个':'开始抽词'}</button><button id="reveal">显示答案</button></div><p class="status" id="status"></p></div>`;$('spin').onclick=()=>{let opts=a.filter(x=>x.id!==wheelIndex);wheelIndex=rand(opts.length?opts:a)[0].id;render()};$('reveal').onclick=()=>{$('status').textContent=v?v.py+' · '+v.en:'请先抽取词语'};}}
document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{game=b.dataset.game;document.querySelectorAll('[data-game]').forEach(z=>z.classList.toggle('active',z===b));window.memoryDeck=null;window.matchRows=null;reset()});['mode','pinyin','english','range'].forEach(id=>$(id).addEventListener('change',()=>{if(id==='range'){window.memoryDeck=null;window.matchRows=null;reset()}else render()}));reset();
</script></body></html>
